# Mirror these versions with the AUTISM Client release you are building against.
[versions]
# mod-version is baked into the jar (fabric.mod.json) and the jar filename, and is what the in-game
# UpdateChecker compares against the latest GitHub release tag. It MUST track the release tag: every
# release bumps this and the git tag together (e.g. tag v1.9.1 <-> mod-version 1.9.1). The old "jar stays
# at 1.0.0 while tags advance" convention is dropped — it made the UpdateChecker report a permanent false
# "outdated" notice. 1.14.2 is a patch fixing BossChat's reconnect handling: RelayManager.connect() built a
# new socket without closing the old one, so every reconnect leaked a live connection. The relay resolves a
# username to the FIRST matching connection, so an account holding several sockets could have party invites
# and warp requests delivered to an abandoned one — online, addressed correctly, and seeing nothing. Closing
# it also required RelayClient.close() to honour its own contract: `closing` was assigned but never read, so
# a discarded socket still reported onClose/onText to the manager that had replaced it. Jar is
# bossaddon-<version>.jar.
# The local config FILE stays "boss-pvp.properties", and module ids are scoped under the fabric mod id
# ("bossaddon:pvp:*" / "bossaddon:utility:*") — AUTISM 3.4 rejects any module whose id doesn't start with it.
mod-version = "1.14.2"

minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-api = "0.152.2+26.2"
autism = "3.4"

loom = "1.17.11"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
autism = { module = "com.autismclient:autism", version.ref = "autism" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
